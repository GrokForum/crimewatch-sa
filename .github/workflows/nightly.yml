# Nightly build, tests, data-quality and POPIA gates, and a static-site build.
# No deploy, publish or Pages step: the generated site stays on the runner.
# This workflow has no secrets and does not push.
name: nightly

on:
  schedule:
    - cron: "0 0 * * *"   # 02:00 SAST (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Download official SAPS Q2 workbook
        # SAPS sends only the leaf certificate; the collector verifies against the
        # reviewed Sectigo chain in ci/certs/saps-chain.pem. A certificate/TLS
        # error prints an ::error annotation and a FAIL line on stderr, appends
        # to logs/collector.log and fails this step (exit 2). Never silent.
        run: python pipeline/fetch_official.py workbook
      - name: Show collector log on failure
        if: failure()
        run: |
          if [ -f logs/collector.log ]; then cat logs/collector.log >&2; fi
      - name: Build (ingest)
        run: python pipeline/ingest_saps_xlsx.py
      - name: Derived files match their manifest pins
        run: git diff --exit-code -- data/
      - name: Tests
        run: python -m pytest -q
      - name: Data-quality gate
        run: python pipeline/dq_check.py data/saps_q2_2026_27_long.csv
      - name: POPIA gate (data)
        run: python pipeline/popia_gate.py data
      - name: Build static site
        run: python pipeline/build_site.py build/site
      - name: POPIA and hygiene gate (generated site)
        run: python pipeline/site_gate.py build/site
