# Nightly build, tests and data-quality gate. No deploy, publish or Pages step.
# Publishing stays off. This workflow has no secrets and does not push.
name: nightly

on:
  schedule:
    - cron: "0 0 * * *"   # 02:00 SAST (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Download official SAPS Q2 workbook
        run: |
          mkdir -p raw/q2-2026-27
          url=$(python -c 'import json; print(json.load(open("data/manifest.json"))["workbook"]["url"])')
          dest=$(python -c 'import json; print(json.load(open("data/manifest.json"))["workbook"]["path"])')
          mkdir -p "$(dirname "$dest")"
          # SAPS sends only the leaf certificate. Verify against the reviewed
          # Sectigo intermediate + root in ci/certs/saps-chain.pem (no curl -k).
          curl -fsSL --cacert ci/certs/saps-chain.pem -o "$dest" "$url"
          python pipeline/verify_workbook.py "$dest"
      - name: Build (ingest)
        run: python pipeline/ingest_saps_xlsx.py
      - name: Tests
        run: python -m pytest -q
      - name: Data-quality gate
        run: python pipeline/dq_check.py data/saps_q2_2026_27_long.csv
      - name: POPIA gate
        run: python pipeline/popia_gate.py data
